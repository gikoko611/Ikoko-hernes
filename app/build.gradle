plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ikoko.herness'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ikoko.herness'
        minSdk 23
        targetSdk 29
        versionCode 2
        versionName '1.0.0'
        ndk { abiFilters 'armeabi-v7a' }
    }

    buildTypes {
        debug { }
        release { signingConfig signingConfigs.debug; minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
}
