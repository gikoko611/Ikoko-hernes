name: G.I KO KO HARNESS PRO - AndroidHarness ARMv7 Migration Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout branding repository
        uses: actions/checkout@v4
        with:
          ref: harness-migration

      - name: Preserve G.I KO KO branding assets
        run: |
          mkdir -p "$RUNNER_TEMP/giko-brand"
          cp "Duck-ai-image-2026-11-19-08-09.jpeg" "$RUNNER_TEMP/giko-brand/icon.jpeg"
          cp ".github/workflows/harness-migration-build.yml" "$RUNNER_TEMP/giko-brand/workflow.yml"

      - name: Fetch AndroidHarness upstream source
        run: |
          git clone --depth 1 https://github.com/Sanuu7/AndroidHarness.git "$RUNNER_TEMP/AndroidHarness"
          test -f "$RUNNER_TEMP/AndroidHarness/app/src/main/java/com/androidharness/app/MainActivity.kt"
          test -f "$RUNNER_TEMP/AndroidHarness/FEATURES.md"

      - name: Import AndroidHarness Core while retaining our branding workflow
        run: |
          cp -a "$RUNNER_TEMP/AndroidHarness/." "$GITHUB_WORKSPACE/"
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/giko-brand/workflow.yml" .github/workflows/harness-migration-build.yml
          rm -f app/build.gradle build.gradle settings.gradle
          rm -rf app/src/main/java/com/ikoko/herness
          rm -f app/src/main/res/drawable-nodpi/ic_launcher.jpg.b64
          mkdir -p app/src/main/res/drawable-nodpi
          cp "$RUNNER_TEMP/giko-brand/icon.jpeg" app/src/main/res/drawable-nodpi/giko_launcher.jpg

      - name: Apply G.I KO KO product identity and Redmi 9A ABI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("app/build.gradle.kts")
          s = gradle.read_text()
          s, n1 = re.subn(r'applicationId\s*=\s*"com\.androidharness\.app"', 'applicationId = "com.ikoko.herness"', s, count=1)
          s, n2 = re.subn(r'abiFilters\s*\+=\s*listOf\([^)]*\)', 'abiFilters += listOf("armeabi-v7a")', s, count=1)
          s, n3 = re.subn(r'versionCode\s*=\s*38', 'versionCode = 200', s, count=1)
          s, n4 = re.subn(r'versionName\s*=\s*"3\.4"', 'versionName = "2.0.0"', s, count=1)
          if not all((n1, n2, n3, n4)):
              raise SystemExit(f"Gradle branding patch failed: appId={n1}, abi={n2}, code={n3}, name={n4}")
          gradle.write_text(s)

          strings = Path("app/src/main/res/values/strings.xml")
          s = strings.read_text()
          s, n = re.subn(r'(<string name="app_name"[^>]*>).*?(</string>)', r'\1G.I KO KO HARNESS PRO\2', s, count=1)
          if not n:
              raise SystemExit("app_name resource not found")
          strings.write_text(s)

          adaptive = Path("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml")
          s = adaptive.read_text()
          s = s.replace('@drawable/ic_launcher_foreground', '@drawable/giko_launcher')
          s = re.sub(r'\s*<monochrome[^>]*/>', '', s)
          adaptive.write_text(s)
          PY
          test -s app/src/main/res/drawable-nodpi/giko_launcher.jpg
          grep -n 'applicationId\|abiFilters\|versionName' app/build.gradle.kts
          grep -n 'app_name' app/src/main/res/values/strings.xml | head -n 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3

      - name: Install pinned Android build packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Validate ARMv7 native toolchain
        run: |
          test -d "$ANDROID_HOME/ndk/27.2.12479018"
          test -f app/src/main/cpp/CMakeLists.txt
          grep -q 'armeabi-v7a' app/build.gradle.kts

      - name: Build G.I KO KO HARNESS PRO
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease -Pdistribution=github

      - name: Verify APK package and ABI
        run: |
          APK=$(find app/build/outputs/apk -type f -name '*release*.apk' | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.ikoko.herness'" "$RUNNER_TEMP/apk-badging.txt"
          unzip -l "$APK" | grep 'lib/armeabi-v7a/' | head -n 10
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/'

      - name: Upload ARMv7 APK and build report
        uses: actions/upload-artifact@v4
        with:
          name: GIKO-KO-KO-HARNESS-PRO-v2.0.0-ARMv7
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
