name: IKOKO HERNESS Full ARMv7 Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      - name: Accept SDK licenses and install packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install uploaded launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d app/src/main/res/drawable-nodpi/ic_launcher.jpg.b64 > app/src/main/res/drawable-nodpi/ic_launcher.jpg
          test -s app/src/main/res/drawable-nodpi/ic_launcher.jpg
      - name: Validate project files
        run: |
          test -f settings.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/ikoko/herness/MainActivity.java
      - name: Build APKs
        run: gradle --no-daemon clean assembleDebug assembleRelease
      - name: Verify APK outputs
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/*.apk | head -n 8
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IKOKO-HERNESS-v1.0.0-ARMv7
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
