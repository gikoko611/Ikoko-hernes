name: IKOKO HERNESS Android ARMv7 Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate project files
        run: |
          test -f settings.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/ikoko/herness/MainActivity.java
      - name: Build debug and release APK
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Verify APK outputs
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk
          ls -lh app/build/outputs/apk/release/*.apk
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IKOKO-HERNESS-ARMv7-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
